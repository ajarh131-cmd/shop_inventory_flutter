name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail

          cd build/ios/iphoneos

          rm -rf Payload

          mkdir -p Payload

          cp -R Runner.app Payload/Runner.app

          zip -qr shop-inventory-ios.ipa Payload

          ls -lh shop-inventory-ios.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: shop-inventory-ios-ipa
          path: build/ios/iphoneos/shop-inventory-ios.ipa
          if-no-files-found: error
          retention-days: 14